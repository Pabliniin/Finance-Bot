[project]
name = "finance-bot"
version = "3.0.0"
description = "Bot de Discord de señales para XAUUSD y EURUSD: confluencia de estrategias + probabilidad calibrada fuera de muestra. Solo informa; nunca ejecuta operaciones."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.1",
    "requests>=2.32",
    "ta>=0.11.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "discord.py>=2.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "tenacity>=8.3",
]

[project.optional-dependencies]
# Solo en el PC Windows donde corre el terminal MetaTrader 5 (fuente en vivo principal).
mt5 = ["MetaTrader5>=5.0.45"]
# pandas-stubs se omite a proposito: sus tipos obligan a llenar el codigo de
# casts sin encontrar errores reales; mypy se centra en la logica propia.
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
    "types-PyYAML",
]

[project.scripts]
finance-bot = "finance_bot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finance_bot"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
